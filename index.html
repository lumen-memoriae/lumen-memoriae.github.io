<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Shelf</title>
<meta name="description" content="Наша полка: рамки с фотографиями и любимые вещи">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231d2636'/%3E%3Crect x='14' y='12' width='22' height='28' fill='%23d8b46a'/%3E%3Crect x='18' y='16' width='14' height='20' fill='%23f6efe3'/%3E%3Crect x='8' y='44' width='48' height='5' fill='%239a6a44'/%3E%3Ccircle cx='46' cy='38' r='5' fill='%239b5fd6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="scene" aria-label="Полка на стене с рамками и предметами"></canvas>

<!-- две опции сверху -->
<header class="topbar" id="topbar">
  <button class="tb" id="addFrameBtn" type="button">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"/><rect x="7.5" y="6.5" width="9" height="8"/><path d="M12 17v3"/></svg>
    <span class="long">добавить рамку</span><span class="short">+ рамка</span>
  </button>
  <div class="more">
    <button class="tb icon" id="moreBtn" type="button" aria-label="Ещё" aria-haspopup="menu" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
    <div class="menu" id="moreMenu" role="menu" hidden>
      <button type="button" role="menuitem" id="exportBtn">сохранить полку в файл</button>
      <button type="button" role="menuitem" id="resetBtn">вернуть полку как было</button>
    </div>
  </div>
</header>

<div class="pill" id="pill">выбырите что пасматреть</div>

<div id="shade" aria-hidden="true"></div>
<div class="panel" id="panel" role="dialog" aria-live="polite">
  <div class="tape" aria-hidden="true"></div>
  <button class="x" id="close" aria-label="Закрыть">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <h2 id="pTitle"></h2>
  <p id="pText" hidden></p>
  <div class="foot">
    <span class="count" id="pCount"></span>
    <div class="nav">
      <button class="del" id="pDel" type="button" hidden>снять</button>
      <button id="prev" aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button id="next" aria-label="Дальше"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </div>
</div>

<!-- 1) новая рамка: фото + текст -->
<dialog class="sheet" id="dlgFrame" aria-labelledby="dlgFrameTitle">
  <form method="dialog" id="frameForm" novalidate>
    <div class="tape" aria-hidden="true"></div>
    <button class="x" type="button" data-close aria-label="Закрыть"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <h2 id="dlgFrameTitle">новая рамка</h2>
    <label class="drop" id="drop">
      <input type="file" id="fPhoto" accept="image/*">
      <img id="fPreview" alt="" hidden>
      <span class="drop-hint" id="dropHint">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 8"/></svg>
        выберите фото<br><small>или перетащите его сюда</small>
      </span>
    </label>
    <label class="field">подпись
      <input type="text" id="fTitle" maxlength="80" placeholder="например: возьми телефон" autocomplete="off">
    </label>
    <label class="field">текст на записке <small>(необязательно)</small>
      <textarea id="fText" rows="3" maxlength="1200" placeholder="история, дата, что угодно…"></textarea>
    </label>
    <fieldset class="field">
      <legend>рамка</legend>
      <div class="chips" id="fStyle">
        <label><input type="radio" name="fstyle" value="wood" checked><span class="sw wood"></span>дерево</label>
        <label><input type="radio" name="fstyle" value="gold"><span class="sw gold"></span>золото</label>
        <label><input type="radio" name="fstyle" value="black"><span class="sw black"></span>чёрная</label>
        <label><input type="radio" name="fstyle" value="white"><span class="sw white"></span>белая</label>
      </div>
    </fieldset>
    <p class="err" id="fErr" hidden></p>
    <div class="actions">
      <button type="button" class="btn ghost" data-close>отмена</button>
      <button type="submit" class="btn" id="fSubmit">повесить на стену</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="loading">развешиваем рамки…</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/content.js"></script>
<script src="js/util.js"></script>
<script src="js/objects.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
